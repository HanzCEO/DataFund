# Phala Cloud (dstack) deployment of the verifier enclave.
# Secrets (NEAR_AI_API_KEY, PINATA_JWT) are set as encrypted env vars in Phala. Only the CVM can decrypt them.
# The image uses the latest tag. A tag can point at a new build without changing this file. The compose hash
# in the attestation no longer identifies the exact code. Pin a digest (name@sha256:...) for a strict attestation.
services:
  enclave:
    image: docker.io/hanzlearn/datafund-enclave:latest
    restart: always
    ports:
      - "8788:8788"
    volumes:
      # dstack guest agent. Key derivation and TDX quotes come from here.
      - /var/run/dstack.sock:/var/run/dstack.sock
      - enclave-data:/data
    environment:
      - NEAR_NETWORK=testnet
      - DAO_ID=datafund-41bbcc.sputnik-v2.testnet
      - NEAR_AI_API_KEY=${NEAR_AI_API_KEY}
      - NEAR_AI_MODEL=z-ai/glm-5.3-flash
      - PINATA_JWT=${PINATA_JWT}
      - PINATA_GATEWAY=${PINATA_GATEWAY}
      - MIN_SCORE=70
      - AUTO_VOTE=true
volumes:
  enclave-data:
